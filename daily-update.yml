name: Daily Travel Dashboard Update

on:
  schedule:
    - cron: '0 1 * * *'  # UTC 01:00 = Beijing 09:00
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (全部历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install anthropic duckduckgo-search requests

      - name: 智能采集 (DuckDuckGo + Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/collect_news.py

      - name: 生成看板 (嵌入所有历史)
        run: python3 generate.py -o index.html

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          git add daily/${TODAY}.json daily/manifest.json index.html
          git diff --cached --quiet || git commit -m "📊 Daily: ${TODAY} | $(ls daily/2*.json | wc -l) days total"
          git push
