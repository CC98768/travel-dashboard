function getItems(d){return(ALL_DATA.dates[d]&&ALL_DATA.dates[d].items)||[]}
function renderCal(){var h='',dow=['日','一','二','三','四','五','六'];dates.forEach(function(d){var dt=new Date(d+'T00:00:00'),n=getItems(d).length||ALL_DATA.dates[d].total_items||0,cls='cal-day'+(d===curDate?' active':'')+(d===dates[0]?' today':'');h+='<div class="'+cls+'" onclick="switchDate(\''+d+'\')"><div class="dow">周'+dow[dt.getDay()]+'</div><div class="dn">'+dt.getDate()+'日</div><div class="dc">'+n+'条</div></div>'});document.getElementById('calstrip').innerHTML=h}
function switchDate(d){curDate=d;renderCal();renderStats();renderChips();render()}
function renderStats(){var items=getItems(curDate),countries={};items.forEach(function(i){countries[i.country]=1});var tags={爆:0,热:0,新:0};items.forEach(function(i){tags[i.tag]=(tags[i.tag]||0)+1});document.getElementById('sc').textContent=Object.keys(countries).length||25;document.getElementById('sn').textContent=items.length||ALL_DATA.dates[curDate].total_items||250;document.getElementById('sb').textContent=tags['爆']||(ALL_DATA.dates[curDate].tag_summary||{}).爆||0;document.getElementById('sh').textContent=tags['热']||(ALL_DATA.dates[curDate].tag_summary||{}).热||0;document.getElementById('sx').textContent=tags['新']||(ALL_DATA.dates[curDate].tag_summary||{}).新||0}

function renderChips(){var items=getItems(curDate),cats=['全部'];items.forEach(function(i){var sc=i.sub_category||'旅游趋势';if(cats.indexOf(sc)<0)cats.push(sc)});var el=document.getElementById('chips');el.innerHTML='';cats.forEach(function(c){var b=document.createElement('span');b.className='cp'+(c==='全部'?' on':'');b.textContent=c;b.onclick=function(){document.querySelectorAll('.cp').forEach(function(x){x.classList.remove('on')});b.classList.add('on');render()};el.appendChild(b)});['爆','热','新'].forEach(function(t){var b=document.createElement('span');b.className='cp';b.textContent=t;b.style.borderColor=t==='爆'?'#ef4444':t==='热'?'#f97316':'#10b981';b.onclick=function(){document.querySelectorAll('.cp').forEach(function(x){x.classList.remove('on')});b.classList.add('on');renderFiltered(getItems(curDate).filter(function(i){return i.tag===t}))};el.appendChild(b)})}
function render(){var ac=document.querySelector('.cp.on'),cc=ac?ac.textContent:'全部';renderFiltered(cc==='全部'?getItems(curDate):getItems(curDate).filter(function(i){return(i.sub_category||'旅游趋势')===cc}))}
function renderFiltered(items){var q=(document.getElementById('si').value||'').toLowerCase();if(q)items=items.filter(function(i){return(i.title+' '+i.summary+' '+i.country+' '+i.source).toLowerCase().indexOf(q)>=0});var byC={};items.forEach(function(i){if(!byC[i.country])byC[i.country]=[];byC[i.country].push(i)});var h='',fM={'中国':'🇨🇳','日本':'🇯🇵','韩国':'🇰🇷','泰国':'🇹🇭','新加坡':'🇸🇬','越南':'🇻🇳','马来西亚':'🇲🇾','印度':'🇮🇳','菲律宾':'🇵🇭','法国':'🇫🇷','意大利':'🇮🇹','西班牙':'🇪🇸','英国':'🇬🇧','德国':'🇩🇪','希腊':'🇬🇷','土耳其':'🇹🇷','瑞士':'🇨🇭','俄罗斯':'🇷🇺','美国':'🇺🇸','加拿大':'🇨🇦','墨西哥':'🇲🇽','巴西':'🇧🇷','澳大利亚':'🇦🇺','新西兰':'🇳🇿','印度尼西亚':'🇮🇩'};Object.keys(byC).sort().forEach(function(c){var ev=byC[c],fl=fM[c]||'🌍';h+='<div class="cc"><div class="chd" onclick="this.parentElement.classList.toggle(\'open\')"><div class="left"><span class="cf">'+fl+'</span><span class="cn">'+esc(c)+'</span><span class="ct">'+ev.length+'条</span></div><span class="ar">▼</span></div><div class="cb">';ev.forEach(function(e){var rc=e.tag==='爆'?'r1':e.tag==='热'?'r2':'rn',sc=e.sub_category||'旅游趋势',sm=SC_MAP[sc]||{icon:'',color:'#64748b',bg:'#f1f5f9'};var tc=e.tag==='爆'?'boom':e.tag==='热'?'hot':'new';var sl=e.source_url||'#';h+='<div class="ev" onclick="openModal('+items.indexOf(e)+',\''+curDate+'\')"><div class="ev-tag '+tc+'">'+esc(e.tag)+'</div><div class="er '+rc+'">'+sm.icon+'</div><div class="eb"><div class="et">'+esc(e.title)+(sl&&sl!=='#'?'<a href="'+esc(sl)+'" target="_blank" rel="noopener" class="src-link" onclick="event.stopPropagation()">🔗</a>':'')+'</div><div class="tg"><span class="tc tc-sc" style="background:'+sm.bg+';color:'+sm.color+'">'+sm.icon+' '+esc(sc)+'</span></div><div class="es">'+esc(e.summary)+'</div><div class="ei">💡 '+esc(e.impact)+'</div><div class="esr">📎 '+esc(e.source)+(sl&&sl!=='#'?' ｜ 🔗 '+esc(sl).replace(/https?:\/\/([^\/]+).*/,'$1'):'')+' ｜ 📌 '+esc(e.travel_advisory)+'</div></div></div>'});h+='</div></div>'});if(!items.length)h='<div style="text-align:center;padding:40px;color:var(--t3)">暂无匹配结果</div>';document.getElementById('clist').innerHTML=h}
function openModal(idx,date){var items=getItems(date),e=items[idx];if(!e)return;var rc=e.tag==='爆'?'r1':e.tag==='热'?'r2':'rn',sc=e.sub_category||'旅游趋势',sm=SC_MAP[sc]||{icon:'📰',color:'#64748b',bg:'#f1f5f9'};document.getElementById('mr').className='mr '+rc;document.getElementById('mr').textContent=e.tag;document.getElementById('mtl').textContent=e.title;document.getElementById('msum').textContent=e.summary;var kfArr=Array.isArray(e.key_figures)?e.key_figures:[e.key_figures||'暂无数据'];document.getElementById('mkf').innerHTML=kfArr.map(function(f){return'<div class="kf">'+esc(f)+'</div>'}).join('');document.getElementById('mimp').textContent=e.impact;document.getElementById('madv').innerHTML='📌 '+esc(e.travel_advisory);document.getElementById('msrc').textContent='📎 '+e.source;var sl=e.source_url||'#';document.getElementById('msl').href=sl;document.getElementById('msl').textContent=sl&&sl!=='#'?'🔗 查看信源: '+sl.replace(/https?:\/\/([^\/]+).*/,'$1'):'🔗 百度搜索详情';if(!sl||sl==='#'){document.getElementById('msl').href='https://www.google.com/search?q='+encodeURIComponent(e.title)}document.getElementById('mo').classList.add('show')}
function closeModal(){document.getElementById('mo').classList.remove('show')}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
renderCal();renderStats();renderChips();render();
