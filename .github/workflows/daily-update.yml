name: 每日旅游热点采集

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行数据采集
        id: collect
        run: |
          python scripts/collect.py
          echo "=== 验证数据文件 ==="
          ls -la data/
          echo "=== today.json 大小 ==="
          wc -c data/today.json 2>/dev/null || echo "today.json 不存在!"
          # 检查today.json是否有效
          if [ -f data/today.json ]; then
            ITEMS=$(python3 -c "import json; d=json.load(open('data/today.json')); print(len(d.get('dates',{}).get(d.get('today',''),{}).get('items',[])))" 2>/dev/null || echo "0")
            echo "采集条目数: $ITEMS"
            if [ "$ITEMS" -lt "30" ]; then
              echo "items_count=$ITEMS" >> $GITHUB_OUTPUT
              echo "❌ 数据不足($ITEMS条)，跳过HTML生成"
              exit 1
            fi
          else
            echo "❌ today.json 不存在，跳过"
            exit 1
          fi
          echo "items_count=$ITEMS" >> $GITHUB_OUTPUT
        env:
          TZ: Asia/Shanghai

      - name: 生成看板 HTML
        if: success()
        run: |
          echo "=== 生成看板 ==="
          python scripts/generate_dashboard.py -d data/today.json -o index.html
          echo "=== 验证 HTML ==="
          ls -la index.html
          grep -o 'var ALL_DATA' index.html | wc -l || echo "ALL_DATA 未找到!"

      - name: 提交到 main 分支
        if: success()
        run: |
          git config user.name "Travel Dashboard Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "📊 每日更新: $(date +%Y-%m-%d)"
          git push
          echo "=== 推送完成 ==="

      - name: 采集失败通知
        if: failure()
        run: |
          echo "⚠️ 今日数据采集失败或数据不足，保留昨日版本"
          echo "请检查 collect.py 信源是否正常工作"
